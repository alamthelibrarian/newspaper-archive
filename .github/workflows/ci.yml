name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs

  package:
    name: Release ZIP contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable ZIP
        run: |
          mkdir -p build/newspaper-archive
          rsync -a --exclude-from=.distignore ./ build/newspaper-archive/
          cd build
          zip -rq ../newspaper-archive-test.zip newspaper-archive
      - name: Verify distributable
        run: |
          unzip -Z1 newspaper-archive-test.zip > package-files.txt
          grep -qx 'newspaper-archive/newspaper-archive.php' package-files.txt
          grep -qx 'newspaper-archive/readme.txt' package-files.txt
          grep -qx 'newspaper-archive/uninstall.php' package-files.txt
          grep -qx 'newspaper-archive/languages/newspaper-archive-id_ID.po' package-files.txt
          ! grep -qE '(^|/)(\.git|\.github|vendor|node_modules)(/|$)' package-files.txt
          ! grep -q 'newspaper-archive/README.md' package-files.txt
