name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir -p build/newspaper-archive
          rsync -a --exclude-from=.distignore ./ build/newspaper-archive/
          cd build
          zip -rq "../newspaper-archive-${GITHUB_REF_NAME}.zip" newspaper-archive
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: newspaper-archive-${{ github.ref_name }}.zip
          generate_release_notes: true
